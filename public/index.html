<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 知遇.同路人</title>
  <meta name="description" content="使用知乎账号登录，授权公开数据后进入同路人。" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <style>
    :root {
      --blue: #0084FF;
      --blue-deep: #0066CC;
      --ink: #0F172A;
      --muted: #64748B;
      --bg: #F3F6FA;
      --card: #fff;
      --line: #DDE5EF;
      --green: #10B981;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 50% 40% at 20% 0%, rgba(0,132,255,.12), transparent 55%),
        radial-gradient(ellipse 40% 35% at 90% 20%, rgba(16,185,129,.08), transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 36px 32px 28px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .08);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), #5EB0FF);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
    }
    .brand { font-weight: 700; font-size: 17px; }
    .brand span { color: var(--blue); }
    h1 {
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: -.02em;
      margin-bottom: 10px;
    }
    .lead {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: .15s ease;
    }
    .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .btn-primary {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 8px 20px rgba(0,132,255,.25);
    }
    .btn-primary:hover { background: var(--blue-deep); }
    .btn-ghost {
      margin-top: 12px;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
      font-size: 13px;
      min-height: 40px;
    }
    .btn-ghost:hover { color: var(--ink); }
    .status {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      min-height: 1.5em;
    }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }
    .note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <img class="mark" src="/logo.svg" alt="知遇.同路人" width="42" height="42" style="border-radius:14px;object-fit:cover;background:none;display:block" />
      <div class="brand">知遇.<span>同路人</span></div>
    </div>
    <h1>用知乎账号登录</h1>
    <p class="lead">登录后授权公开创作、关注与收藏。AI 只分析这些公开数据，再生成你的 Soul Profile、同路人匹配与今日擦肩。</p>
    <a class="btn btn-primary" id="btn-login" href="/api/oauth/start">知乎 OAuth 登录</a>
    <a class="btn btn-ghost" id="btn-skip" href="/app.html#/">先看看演示（不登录）</a>
    <p class="status" id="status">检查登录状态…</p>
    <p class="note">需在知乎授权页本人点击确认。本地预览无法完成登录，请使用已部署的公网地址。</p>
  </main>
  <script>
    async function boot() {
      const status = document.getElementById('status');
      const login = document.getElementById('btn-login');
      try {
        const r = await fetch('/api/session');
        const j = await r.json();
        if (j && j.authenticated) {
          status.textContent = '已登录，正在进入…';
          status.className = 'status ok';
          location.replace('/app.html');
          return;
        }
      } catch (e) { /* ignore */ }

      const params = new URLSearchParams(location.search);
      if (params.get('oauth') === 'ok') {
        status.textContent = '授权成功，正在进入应用…';
        status.className = 'status ok';
        location.replace('/app.html');
        return;
      }
      if (params.get('oauth') === 'error') {
        status.textContent = params.get('msg') || '授权失败，请重试';
        status.className = 'status err';
      } else {
        status.textContent = '尚未登录';
        status.className = 'status';
      }
    }
    boot();
  </script>
</body>
</html>
